<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perubahan Disimpan</title>
    <style>
        :root {
            --primary: #f39c12;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --white: #ffffff;
            --success: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('usk.webp') no-repeat;
            background-size: cover;
            background-position: center;
        }

        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 8px solid var(--primary);
        }

        .icon {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        h2 { margin: 0 0 10px; color: var(--text); }
        p { color: #8d99ae; margin-bottom: 25px; line-height: 1.5; }

        .btn-kembali {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-kembali:hover {
            background-color: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <span class="icon">✅</span>
    <h2>Update Berhasil!</h2>
    <p>Data fakultas telah berhasil diperbarui di dalam sistem krs online.</p>
    <a href="fakultas.html" class="btn-kembali">Kembali ke Menu</a>
</div>

</body>
</html>
