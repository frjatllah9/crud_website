<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penghapusan Berhasil</title>
    <style>
        :root {
            --danger: #ef233c;
            --dark: #2b2d42;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: url('usk.webp') no-repeat;
            background-size: cover;
            background-position: center;
        }

        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(0);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 90px;
            height: 90px;
            background: #fff1f2;
            color: var(--danger);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 25px;
            border: 2px solid #ffe4e6;
        }

        h2 {
            color: var(--dark);
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            color: #8d99ae;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: var(--dark);
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--danger);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(239, 35, 60, 0.2);
        }

        .confetti {
            position: absolute;
            font-size: 20px;
            animation: fall 3s linear forwards;
            opacity: 0;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-circle">🗑️</div>
    <h2>Data Terhapus!</h2>
    <p>Record fakultas telah berhasil dihapus dari database secara permanen.</p>

    <a href="/fakultas" class="btn">Kembali ke Menu</a>
</div>

<script>
    // Sedikit efek interaktif sederhana untuk merayakan keberhasilan hapus
    function createConfetti() {
        const icons = ['✨', '🗑️', '✅'];
        for(let i=0; i<15; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.innerText = icons[Math.floor(Math.random() * icons.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(confetti);
        }
    }
    createConfetti();
</script>

</body>
</html>
