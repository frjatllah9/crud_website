<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Perangkat</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3f37c9;
            --text-light: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('pexels-photo-31432739.jpg') no-repeat;
            background-size: cover;
            background-position: center;
        }

        /* Card Efek Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            color: var(--text-light);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.6em;
            text-align: center;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        /* Input Transparan */
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
            font-size: 1em;
            color: var(--text-light);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(67, 97, 238, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        input[type="submit"] {
            flex: 2;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .btn-batal {
            flex: 1;
            text-align: center;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .btn-batal:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        /* Ikon Dekoratif */
        .header-icon {
            font-size: 3em;
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <span class="header-icon">🖥️</span>
    <h3>Tambah Perangkat</h3>

    <form method="POST" action="/fakultas/tambah_proses">
        <div class="form-group">
            <label for="txtNama">Nama Perangkat</label>
            <input name="txtNama" type="text" placeholder="Contoh: ESP32-C6" required>
        </div>

        <div class="form-group">
            <label for="txtSingkatan">ID Perangkat</label>
            <input name="txtSingkatan" type="text" placeholder="Contoh: 1234-5678-90" required>
        </div>

        <div class="btn-group">
            <input type="submit" value="Simpan Data">
            <a href="menu.html" class="btn-batal">Kembali</a>
        </div>
    </form>
</div>

</body>
</html>
