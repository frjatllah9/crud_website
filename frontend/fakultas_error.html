<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tidak Ditemukan</title>
    <style>
        :root {
            --danger: #ef233c;
            --bg: #fff5f5;
            --text: #2b2d42;
            --white: #ffffff;
            --gray: #8d99ae;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('usk.webp') no-repeat;
            background-size: cover;
            background-position: center;
        }

        .error-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(239, 35, 60, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-bottom: 8px solid var(--danger);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #ffe3e3;
            color: var(--danger);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            margin: 0 auto 20px;
            font-weight: bold;
        }

        h2 {
            margin: 0 0 10px;
            color: var(--danger);
            font-size: 1.5em;
        }

        .message {
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .highlight {
            color: var(--text);
            font-weight: bold;
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-kembali {
            display: inline-block;
            background-color: var(--danger);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-kembali:hover {
            background-color: #d90429;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 35, 60, 0.3);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="icon-box">!</div>
    <h2>Data Tidak Ditemukan</h2>
    <p class="message">
        Maaf, data fakultas dengan ID <span class="highlight">{{ id_cari }}</span> tidak terdaftar dalam sistem kami.
    </p>

    <a href="fakultas.html" class="btn-kembali">Kembali Ke Menu</a>
</div>

</body>
</html>
